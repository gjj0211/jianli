function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e}
function toast(m){const t=document.getElementById('ts');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2000)}

/* 导航 */
const navItems=[{h:'#top',l:'首页'},{h:'#highlights',l:'亮点'},{h:'#experience',l:'经历'},{h:'#projects',l:'项目'},{h:'#gallery',l:'作品'},{h:'#skills',l:'技能'},{h:'#education',l:'教育'}];
const nl=document.getElementById('nl');
navItems.forEach(i=>{const a=el('a','',i.l);a.href=i.h;nl.appendChild(a)});

/* Hero 徽章 */
const hb=document.getElementById('hb');
resume.badges.forEach((b,i)=>{hb.appendChild(el('span','bg'+(i%3===0?' a':''),b))});

/* 亮点 */
const hl=document.getElementById('hl');
resume.highlights.forEach(h=>{
  hl.appendChild(el('div','hc','<div class="hnum">'+h.num+'<span>'+h.unit+'</span></div><div class="hlab">'+h.label+'</div><div class="hdesc">'+h.desc+'</div>'));
});

/* 经历 Tabs */
const et=document.getElementById('et');
const ep=document.getElementById('ep');
const cats=[{k:'work',l:'工作/实习'},{k:'campus',l:'校园/实践'}].filter(c=>resume.experience[c.k]&&resume.experience[c.k].length);
cats.forEach((cat,idx)=>{
  const btn=el('button','tb',cat.l);
  btn.setAttribute('role','tab');
  btn.setAttribute('aria-selected',idx===0?'true':'false');
  btn.setAttribute('aria-controls','pn-'+cat.k);
  btn.id='tb-'+cat.k;
  btn.tabIndex=idx===0?0:-1;
  et.appendChild(btn);
  const panel=el('div','tp'+(idx===0?' active':''));
  panel.id='pn-'+cat.k;
  panel.setAttribute('role','tabpanel');
  panel.setAttribute('aria-labelledby','tb-'+cat.k);
  resume.experience[cat.k].forEach(x=>{
    let lis='';x.points.forEach(p=>{lis+='<li>'+p+'</li>'});
    panel.appendChild(el('div','ec','<div class="eh"><div><div class="et">'+x.title+'</div><div class="eco">'+x.company+'</div></div><div class="ed">'+x.date+'</div></div><ul class="el">'+lis+'</ul>'));
  });
  ep.appendChild(panel);
});
/* Tab 交互 */
const tabs=et.querySelectorAll('.tb');
tabs.forEach((btn,i)=>{
  btn.addEventListener('click',()=>{
    tabs.forEach((b,j)=>{b.setAttribute('aria-selected',j===i?'true':'false');b.tabIndex=j===i?0:-1});
    et.parentElement.querySelectorAll('.tp').forEach((p,j)=>p.classList.toggle('active',j===i));
  });
  btn.addEventListener('keydown',e=>{
    let n=-1;
    if(e.key==='ArrowRight')n=(i+1)%tabs.length;
    else if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;
    if(n>=0){e.preventDefault();tabs[n].focus();tabs[n].click()}
  });
});

/* 项目 */
const pg=document.getElementById('pg');
resume.projects.forEach(p=>{
  const card=el('div','pc');
  let st='';p.stack.forEach(s=>{st+='<span class="stg">'+s+'</span>'});
  card.innerHTML='<div class="pn">'+p.name+'</div><div class="ps">'+st+'</div><div class="pr">'+p.result+'</div>';
  pg.appendChild(card);
});

/* 作品集 */
const gal=document.getElementById('gal');
resume.gallery.forEach(g=>{
  const item=el('div','gi');
  const img=el('img');
  img.src=g.src;img.alt=g.caption;img.loading='lazy';
  img.onerror=function(){
    this.parentNode.innerHTML='<div class="gph">'+g.caption+'（图片未找到）</div><div class="gcap">'+g.caption+'<span>'+g.tag+'</span></div>';
  };
  item.appendChild(img);
  item.appendChild(el('div','gcap',g.caption+'<span>'+g.tag+'</span>'));
  gal.appendChild(item);
});

/* 技能 */
const sg=document.getElementById('sg');
resume.skills.forEach(g=>{
  const box=el('div','skg');
  let html='<div class="skt">'+g.icon+' '+g.group+'</div>';
  g.items.forEach(it=>{
    html+='<div class="ski"><div class="skh"><span class="skn">'+it.name+'</span><span class="skp">'+it.pct+'%</span></div><div class="skb"><div class="skf" data-pct="'+it.pct+'"></div></div></div>';
  });
  box.innerHTML=html;
  sg.appendChild(box);
});
/* 技能条动画 */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      e.target.querySelectorAll('.skf').forEach(f=>{f.style.width=f.dataset.pct+'%'});
      io.unobserve(e.target);
    }
  });
},{threshold:.2});
document.querySelectorAll('.skg').forEach(s=>io.observe(s));

/* 教育 */
const tl=document.getElementById('tl');
resume.education.forEach(e=>{
  tl.appendChild(el('div','tli','<div class="tlt">'+e.title+'</div><div class="tls">'+e.sub+'</div>'+(e.date?'<div class="tld">'+e.date+'</div>':'')));
});

/* 邮箱防爬虫 */
const em=resume.email;
const [user,domain]=em.split('@');
document.getElementById('fe').addEventListener('click',e=>{e.preventDefault();location.href='mai'+'lto:'+user+'@'+domain});
document.getElementById('ce').addEventListener('click',()=>{
  const full=user+'@'+domain;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(full).then(()=>toast('邮箱已复制：'+full)).catch(()=>toast('邮箱：'+full));
  }else{
    const ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('邮箱已复制：'+full)}catch(e){toast('邮箱：'+full)}
    document.body.removeChild(ta);
  }
});

/* 主题切换 */
const tt=document.getElementById('tt');
const savedTheme=localStorage.getItem('theme');
if(savedTheme==='dark'||(!savedTheme&&matchMedia('(prefers-color-scheme:dark)').matches)){
  document.documentElement.setAttribute('data-theme','dark');tt.textContent='☀️';
}
tt.addEventListener('click',()=>{
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){document.documentElement.removeAttribute('data-theme');tt.textContent='🌙';localStorage.setItem('theme','light')}
  else{document.documentElement.setAttribute('data-theme','dark');tt.textContent='☀️';localStorage.setItem('theme','dark')}
});

/* 打印 */
document.getElementById('pb').addEventListener('click',()=>window.print());

/* 返回顶部 */
const bt=document.getElementById('bt');
addEventListener('scroll',()=>{bt.classList.toggle('show',scrollY>400)},{passive:true});
bt.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));

/* 更新时间 */
const now=new Date();
document.getElementById('ut').textContent=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');
</script>
